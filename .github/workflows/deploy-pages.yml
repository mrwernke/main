name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sat-math-prep/package-lock.json

      - name: Install dependencies
        working-directory: sat-math-prep
        run: npm ci

      - name: Build
        working-directory: sat-math-prep
        env:
          VITE_BASE_PATH: /main/sat-math-prep/
        run: npm run build

      - name: Assemble site
        run: |
          rm -rf dist
          mkdir -p dist/sat-math-prep
          mkdir -p dist/math-applets/domain-range-helper
          cp -R sat-math-prep/dist/. dist/sat-math-prep/
          cp math-applets/domain-range-helper/index.html dist/math-applets/domain-range-helper/index.html
          cp main-site/index.html dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4