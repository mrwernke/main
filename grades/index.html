<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Grade Processor v2</title>
    <style>
        :root { --primary-color: #1b5e20; --bg-color: #f4f6f8; --border-color: #ddd; }
        body { font-family: system-ui, sans-serif; background: var(--bg-color); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); }
        .form-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: bold; font-size: 0.85rem; }
        input, select, button, textarea { padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; }
        button { background: var(--primary-color); color: #fff; border: none; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; max-height: 150px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 15px; }
        th, td { border: 1px solid var(--border-color); padding: 8px; text-align: center; }
        th { background: #e8f5e9; color: var(--primary-color); position: sticky; top: 0; }
        .student-name { text-align: left; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

<div class="container">
    <h1 style="color: var(--primary-color); margin:0;">Canvas Grade Processor v2</h1>

    <div class="card">
        <div class="form-row">
            <div class="form-group">
                <label>Unit</label>
                <select id="unit-select">
                    <option value="1">Unit 1</option><option value="2">Unit 2</option><option value="3">Unit 3</option>
                    <option value="4">Unit 4</option><option value="5">Unit 5</option><option value="6">Unit 6</option>
                    <option value="7">Unit 7</option><option value="8">Unit 8</option>
                </select>
            </div>
            <div class="form-group">
                <label>Section</label>
                <select id="section-select"><option value="ALL">All Sections</option></select>
            </div>
            <div class="form-group">
                <label>Grades CSV</label>
                <input type="file" id="grades-csv" accept=".csv">
            </div>
            <div class="form-group">
                <label>Late Assignments CSV</label>
                <input type="file" id="late-csv" accept=".csv">
            </div>
            <div class="form-group" style="justify-content: flex-end;">
                <button id="toggle-view">Switch to Skill Checks View</button>
            </div>
        </div>
    </div>

    <!-- HW Configuration -->
    <div class="card" id="hw-config">
        <h3>Homework Configuration</h3>
        <div class="form-row">
            <div class="form-group" style="flex: 2;">
                <label>Select HW Columns from Gradebook</label>
                <div class="checkbox-grid" id="hw-columns-container"></div>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>HW Conversion Scale (Min Sum = Grade)</label>
                <textarea id="hw-scale" rows="6" style="font-family: monospace;">11=100&#10;10.5=95&#10;10=90&#10;9=85&#10;8=80&#10;7=75&#10;6=70&#10;5=60&#10;4=50&#10;3=40&#10;2=30&#10;1=20&#10;0.1=10&#10;0=0</textarea>
            </div>
        </div>
        <button onclick="renderTable()">Update HW Table</button>
    </div>

    <!-- Skill Checks Configuration -->
    <div class="card hidden" id="sc-config">
        <h3>Skill Checks Configuration</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Late Submission Penalty (Points out of 50)</label>
                <input type="number" id="late-penalty" value="5" step="0.5">
            </div>
        </div>
        <button onclick="renderTable()">Update Skill Checks Table</button>
    </div>

    <div class="card">
        <h2 id="view-title">Homework Grades</h2>
        <div style="overflow-x: auto;">
            <table id="grades-table">
                <thead id="table-header"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let gradesData = [];
    let lateData = [];
    let allHeaders = [];
    let currentView = 'HW'; // 'HW' or 'SC'
    
    document.getElementById('toggle-view').addEventListener('click', (e) => {
        if (currentView === 'HW') {
            currentView = 'SC';
            e.target.textContent = 'Switch to HW View';
            document.getElementById('hw-config').classList.add('hidden');
            document.getElementById('sc-config').classList.remove('hidden');
            document.getElementById('view-title').textContent = 'Skill Checks Grades';
        } else {
            currentView = 'HW';
            e.target.textContent = 'Switch to Skill Checks View';
            document.getElementById('hw-config').classList.remove('hidden');
            document.getElementById('sc-config').classList.add('hidden');
            document.getElementById('view-title').textContent = 'Homework Grades';
        }
        renderTable();
    });

    document.getElementById('grades-csv').addEventListener('change', (e) => {
        Papa.parse(e.target.files[0], { header: true, skipEmptyLines: true, complete: res => {
            allHeaders = res.meta.fields;
            gradesData = res.data.filter(r => r.Student && r.Student !== "Points Possible" && !r.Student.includes("Student, Test"));
            populateSections();
            populateHWColumns();
            renderTable();
        }});
    });

    document.getElementById('late-csv').addEventListener('change', (e) => {
        Papa.parse(e.target.files[0], { header: true, skipEmptyLines: true, complete: res => {
            lateData = res.data;
            renderTable();
        }});
    });

    document.getElementById('section-select').addEventListener('change', renderTable);
    document.getElementById('unit-select').addEventListener('change', renderTable);

    function cleanSection(sec) {
        if (!sec) return "Unknown";
        if (sec.includes("ENL")) return "G4 ENL";
        const m = sec.match(/(\d)\(([BG])\)/);
        return m ? `${m[2]}${m[1]}` : sec;
    }

    function populateSections() {
        const sections = [...new Set(gradesData.map(r => cleanSection(r.Section)))].sort();
        const sel = document.getElementById('section-select');
        sel.innerHTML = '<option value="ALL">All Sections</option>';
        sections.forEach(s => sel.innerHTML += `<option value="${s}">${s}</option>`);
    }

    function populateHWColumns() {
        const container = document.getElementById('hw-columns-container');
        container.innerHTML = '';
        allHeaders.forEach(h => {
            if (['Student', 'ID', 'SIS User ID', 'SIS Login ID', 'Section'].includes(h) || h.includes("Current") || h.includes("Final")) return;
            const isChecked = h.includes("HW") || h.includes("Analysis") || h.includes("Review") ? "checked" : "";
            container.innerHTML += `<label><input type="checkbox" class="hw-col-cb" value="${h}" ${isChecked}> ${h}</label>`;
        });
    }

    function getSelectedHWColumns() {
        return Array.from(document.querySelectorAll('.hw-col-cb:checked')).map(cb => cb.value);
    }

    function getHWScale() {
        const lines = document.getElementById('hw-scale').value.split('\n');
        const scale = [];
        lines.forEach(line => {
            const parts = line.split('=');
            if (parts.length === 2) scale.push({ sum: parseFloat(parts[0]), grade: parseFloat(parts[1]) });
        });
        return scale.sort((a, b) => b.sum - a.sum);
    }

    function calculateHWGrade(sum, scale) {
        for (let s of scale) { if (sum >= s.sum) return s.grade; }
        return 0;
    }

    function renderTable() {
        if (!gradesData.length) return;
        const thead = document.getElementById('table-header');
        const tbody = document.getElementById('table-body');
        thead.innerHTML = ''; tbody.innerHTML = '';

        const selectedSec = document.getElementById('section-select').value;
        let students = gradesData;
        if (selectedSec !== 'ALL') students = students.filter(r => cleanSection(r.Section) === selectedSec);
        students.sort((a, b) => a.Student.localeCompare(b.Student));

        if (currentView === 'HW') {
            const hwCols = getSelectedHWColumns();
            const scale = getHWScale();
            
            thead.innerHTML = `<tr><th>Student Name</th><th>Section</th><th>Final HW Grade</th><th>Sum of Scores</th>${hwCols.map(c => `<th>${c}</th>`).join('')}</tr>`;
            
            students.forEach(s => {
                let sum = 0;
                const cells = hwCols.map(c => {
                    const val = parseFloat(s[c]);
                    if (!isNaN(val)) { sum += val; return val; }
                    return '-';
                });
                const grade = calculateHWGrade(sum, scale);
                tbody.innerHTML += `<tr><td class="student-name">${s.Student}</td><td>${cleanSection(s.Section)}</td><td><strong>${grade}</strong></td><td>${sum}</td>${cells.map(c => `<td>${c}</td>`).join('')}</tr>`;
            });
        } else {
            // Skill Checks Logic
            const scCols = allHeaders.filter(h => h.includes("Skill Check"));
            const penalty = parseFloat(document.getElementById('late-penalty').value) || 0;
            const totalChecks = scCols.length;

            thead.innerHTML = `<tr><th>Student Name</th><th>Section</th><th>Skill Checks Score (out of 50)</th><th>Submitted Count</th><th>Total Points</th><th>Late Count</th>${scCols.map(c => `<th>${c}</th>`).join('')}</tr>`;

            students.forEach(s => {
                let subCount = 0;
                let points = 0;
                const cells = scCols.map(c => {
                    const strVal = s[c];
                    if (strVal !== undefined && strVal !== "" && strVal !== null) {
                        const val = parseFloat(strVal);
                        if (!isNaN(val)) {
                            if (val >= 0 && val <= 1) subCount++;
                            points += val;
                            return val;
                        }
                    }
                    return '-';
                });

                // Count Late Submissions for this student
                let lateCount = 0;
                if (lateData.length > 0) {
                    lateCount = lateData.filter(l => l["Student ID"] === s["ID"] && l["Assignment Name"].includes("Skill Check")).length;
                }

                // Calculate base score out of 50, then apply penalty
                let score = totalChecks > 0 ? (subCount / totalChecks) * 50 : 0;
                score = Math.max(0, score - (lateCount * penalty)); // Floor at 0

                tbody.innerHTML += `<tr>
                    <td class="student-name">${s.Student}</td>
                    <td>${cleanSection(s.Section)}</td>
                    <td><strong>${score.toFixed(2)}</strong></td>
                    <td>${subCount} / ${totalChecks}</td>
                    <td>${points.toFixed(2)}</td>
                    <td style="color: ${lateCount > 0 ? 'red' : 'black'};">${lateCount}</td>
                    ${cells.map(c => `<td>${c}</td>`).join('')}
                </tr>`;
            });
        }
    }
</script>
</body>
</html>
